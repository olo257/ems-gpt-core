name: EMS-GPT Core
version: "0.39.3"
slug: ems_gpt_core
description: Niezależny silnik planowania i analityki EMS-GPT
url: https://github.com/olo257/ems-gpt-core
arch:
  - aarch64
startup: application
boot: auto
init: false
watchdog: http://[HOST]:[PORT:8099]/live
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: EMS-GPT Core
homeassistant_api: true
hassio_api: true
auth_api: true
services:
  - mysql:need
options:
  timezone: Europe/Warsaw
  slot_minutes: 15
  command_ttl_seconds: 960
  telemetry_degraded_seconds: 120
  telemetry_stale_seconds: 300
  db_host: core-mariadb
  db_port: 3306
  db_name: ems_gpt
  db_user: ems_gpt_app
  db_password: __DB_PASSWORD__
  source_db: ems_gpt
  bootstrap_from_source: false
  direct_battery_power_mode: discharge_positive
  deye_program_1_soc_pct: 10
  deye_program_2_soc_pct: 10
  deye_program_3_soc_pct: 10
  deye_program_4_soc_pct: 10
  deye_program_5_soc_pct: 10
  deye_program_6_soc_pct: 30
  garden_temperature_entity: sensor.klimat_w_ogrodzie_temperature
  tou_bridge_override_max_minutes: 180
  executor_enabled: false
  executor_dry_run: true
  executor_activation_ack: ""
  connector_service_map_json: "{}"
  executor_battery_import_on_script: script.ems_gpt_core_battery_import_on
  executor_battery_import_off_script: script.ems_gpt_core_battery_import_off
  executor_battery_export_on_script: script.ems_gpt_core_battery_export_on
  executor_battery_export_off_script: script.ems_gpt_core_battery_export_off
  executor_pv_cwu_on_script: script.ems_gpt_core_pv_cwu_on
  executor_pv_cwu_off_script: script.ems_gpt_core_pv_cwu_off
  executor_pv_ev_on_script: script.ems_gpt_core_pv_ev_on
  executor_pv_ev_off_script: script.ems_gpt_core_pv_ev_off
  executor_hp_heat_dhw_on_script: script.ems_gpt_core_hp_heat_dhw_on
  executor_hp_heat_dhw_off_script: script.ems_gpt_core_hp_heat_dhw_off
  ai_observer_enabled: true
map:
  - backup:rw
  - media:rw
schema:
  timezone: str
  slot_minutes: int(15,15)
  command_ttl_seconds: int(60,1800)
  telemetry_degraded_seconds: int(60,600)
  telemetry_stale_seconds: int(120,1800)
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  source_db: str
  bootstrap_from_source: bool
  direct_battery_power_mode: list(legacy_helpers|charge_positive|discharge_positive)
  deye_program_1_soc_pct: int(0,100)
  deye_program_2_soc_pct: int(0,100)
  deye_program_3_soc_pct: int(0,100)
  deye_program_4_soc_pct: int(0,100)
  deye_program_5_soc_pct: int(0,100)
  deye_program_6_soc_pct: int(0,100)
  garden_temperature_entity: str
  tou_bridge_override_max_minutes: int(15,720)
  executor_enabled: bool
  executor_dry_run: bool
  executor_activation_ack: str
  connector_service_map_json: str
  executor_battery_import_on_script: str
  executor_battery_import_off_script: str
  executor_battery_export_on_script: str
  executor_battery_export_off_script: str
  executor_pv_cwu_on_script: str
  executor_pv_cwu_off_script: str
  executor_pv_ev_on_script: str
  executor_pv_ev_off_script: str
  executor_hp_heat_dhw_on_script: str
  executor_hp_heat_dhw_off_script: str
  ai_observer_enabled: bool
