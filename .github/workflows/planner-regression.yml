name: Planner regression
on:
  pull_request:
    paths:
      - 'ems_gpt_core/**'
      - '.github/workflows/planner-regression.yml'
  push:
    branches:
      - 'fix/soc-buy-deadline-20261012'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ems_gpt_core/requirements.txt ]; then pip install -r ems_gpt_core/requirements.txt; fi
      - name: Compile Python sources
        run: python -m compileall -q ems_gpt_core
      - name: Planner regression tests
        run: python -m unittest discover -s ems_gpt_core/tests -p 'test_buy_deadline_regression.py' -v
